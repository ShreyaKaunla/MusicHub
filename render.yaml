# Put this file at the REPO ROOT (next to backend/ and my-react-app/).
services:
  - type: web
    name: musichub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS        # set to your Vercel URL, e.g. https://musichub.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX   # optional: also allow Vercel preview URLs
        sync: false
